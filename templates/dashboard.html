<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">

    <div class="card shadow-lg rounded-4 p-4">

        <h2 class="text-center text-primary mb-4">
            AI Resume Analyzer
        </h2>

        <div class="row mb-4">

    <div class="col-md-4">
        <div class="card bg-primary text-white p-3">
            <h5>Total Resumes</h5>
            <h2>{{ total_resumes }}</h2>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-success text-white p-3">
            <h5>Average Resume Score</h5>
            <h2>{{ avg_score }}%</h2>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-warning text-dark p-3">
            <h5>Average ATS Score</h5>
            <h2>{{ avg_ats }}%</h2>
        </div>
    </div>

</div>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <input
                type="file"
                class="form-control"
                name="resume"
                required>
            </div>

            <div class="mb-3">
    <label>Job Description</label>
    <textarea class="form-control"
        name="job_description"
        rows="8"
        placeholder="Paste Job Description Here..."
        required></textarea>
</div>

            <button type="submit" class="btn btn-success w-100">
                Upload Resume
            </button>

        </form>
        <hr>

<h4 class="text-primary">Welcome,{{ session.username}}</h4>

<div class="d-grid gap-2">

   <a href="/" class="btn btn-primary w-100 mb-2">🏠 Home</a>

   <a href="/resume-builder" class="btn btn-primary w-100 mb-2">📄Create Resume </a>

<a href="/history" class="btn btn-info w-100 mb-2">📄 Resume History</a>

<a href="/analytics" class="btn btn-dark w-100 mb-2">
    📊 Analytics
</a>


<a href="/profile" class="btn btn-warning w-100 mb-2">👤 My Profile</a>

<a href="/change-password" class="btn btn-secondary w-100 mb-2">🔒 Change Password</a>

<a href="/email-report" class="btn btn-success w-100 mb-2">
    📧 Email Report
</a>

<a href="/resume-tips" class="btn btn-outline-primary w-100 mb-2">
    🤖 AI Resume Tips
</a>

<a href="/logout" class="btn btn-danger w-100">🚪 Logout</a>

</div>

    </div>

</div>

</body>
</html>
