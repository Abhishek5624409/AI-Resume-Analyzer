<!DOCTYPE html>
<html>
<head>
<title>Professional Resume</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f5f5;
}

.resume{
width:850px;
margin:auto;
background:white;
box-shadow:0px 0px 15px gray;
}

.header{
background:#0d6efd;
color:white;
padding:30px;
text-align:center;
}

.photo{
width:140px;
height:140px;
border-radius:50%;
border:5px solid white;
object-fit:cover;
}

.section{
padding:25px;
}

</style>

</head>

<body>

<div class="resume">

<div class="header">

{% if photo_path %}
<img src="/{{photo_path}}" class="photo">
{% endif %}

<h2>{{name}}</h2>

<p>{{email}} | {{phone}}</p>

<h5>Java Full Stack Developer</h5>

</div>

<div class="section">

<h3>Skills</h3>

<p>{{skills}}</p>

<hr>

<h3>Experience</h3>

<p>{{experience}}</p>

<hr>

<h3>Projects</h3>

<p>{{projects}}</p>

</div>

</div>

</body>
</html>
